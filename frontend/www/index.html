<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#252a40">
  <title>WalkApp</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ШАПКА: кто ты -->
  <div class="top">
    <div class="top-ava" id="my-ava">A</div>
    <div class="top-info">
      <div class="top-small">Привет, гуляющий!</div>
      <div class="top-name" id="my-name">Александр</div>
    </div>
  </div>

  <div class="wrap">

    <!-- БЛОК 1: написать статус -->
    <div class="block">
      <div class="block-title">📝 Написать статус</div>
      <div class="block-hint">Расскажи, где гуляешь</div>

      <textarea id="text"
                placeholder="Например: Гуляю в парке, кто со мной?"></textarea>

      <button class="big-btn" id="btn-post">
        <span class="emoji">📤</span>
        <span>ОПУБЛИКОВАТЬ</span>
      </button>
    </div>

    <!-- БЛОК 2: уведомление -->
    <div class="block">
      <div class="block-title">🔔 Напоминание</div>
      <div class="block-hint">Нажми — придёт уведомление в шторку</div>

      <button class="big-btn green" id="btn-notify">
        <span class="emoji">🔔</span>
        <span>ПОКАЗАТЬ УВЕДОМЛЕНИЕ</span>
      </button>
    </div>

    <!-- БЛОК 3: список людей -->
    <div class="block-title" style="padding: 0 4px 14px;">
      👥 Кто гуляет рядом
    </div>

    <div id="feed" class="people">
      <div class="loading">Загружаем…</div>
    </div>

  </div>

  <!-- НИЖНЕЕ МЕНЮ -->
  <div class="bottom">
    <button class="on" data-tab="feed">
      <span class="ico">🏠</span>
      <span>Лента</span>
    </button>
    <button data-tab="map">
      <span class="ico">🗺️</span>
      <span>Карта</span>
    </button>
    <button data-tab="me">
      <span class="ico">👤</span>
      <span>Профиль</span>
    </button>
  </div>

  <div id="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
